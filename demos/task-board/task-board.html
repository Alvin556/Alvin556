<title>Earth Group Task Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: sticky toolbar, then a horizontally scrolling lane of columns on desktop that stacks on phones. */
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --surface-2: #e9edf1;
    --fg: #1a2430;
    --fg-2: #5b6b7c;
    --line: #d5dce4;
    --accent: #1f4e79;
    --accent-fg: #ffffff;
    --accent-soft: #e3ecf5;
    --hot: #c2410c;
    --hot-soft: #fdebe1;
    --warn: #b7791f;
    --warn-soft: #fbf1dc;
    --ok: #2f7d4f;
    --ok-soft: #e2f2e8;
    --shadow: 0 1px 2px rgba(26,36,48,.06), 0 4px 12px rgba(26,36,48,.06);
    --display: 'Sora', 'Segoe UI', system-ui, sans-serif;
    --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', 'Consolas', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151c; --surface: #18202a; --surface-2: #222c38; --fg: #e6ebf0; --fg-2: #93a1b1;
      --line: #2c3745; --accent: #6aa5d8; --accent-fg: #0f151c; --accent-soft: #1d2d3f;
      --hot: #f28b5c; --hot-soft: #3a2218; --warn: #e0b35a; --warn-soft: #352b14;
      --ok: #6cc38f; --ok-soft: #173224;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151c; --surface: #18202a; --surface-2: #222c38; --fg: #e6ebf0; --fg-2: #93a1b1;
    --line: #2c3745; --accent: #6aa5d8; --accent-fg: #0f151c; --accent-soft: #1d2d3f;
    --hot: #f28b5c; --hot-soft: #3a2218; --warn: #e0b35a; --warn-soft: #352b14;
    --ok: #6cc38f; --ok-soft: #173224;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* Toolbar */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding-block: 10px;
    padding-inline: 16px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; margin-right: auto; }
  .brand h1 {
    font-family: var(--display); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em;
    margin: 0; text-wrap: balance; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand h1[contenteditable="true"] { border-bottom: 1px dashed var(--line); cursor: text; }
  .sync { font-family: var(--mono); font-size: .72rem; color: var(--fg-2); white-space: nowrap; }
  .sync::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--fg-2); margin-right: 6px; vertical-align: 1px; }
  .sync.live::before { background: var(--ok); }
  .sync.ro::before { background: var(--warn); }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .field { display: flex; align-items: center; gap: 6px; }
  .field label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-2); }
  select, input[type="search"], input[type="text"], input[type="date"], textarea {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; min-height: 34px;
  }
  input[type="search"] { width: 170px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: var(--surface); border: 0; padding: 6px 10px; color: var(--fg-2); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; min-height: 34px; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--hot); border-color: var(--hot); background: transparent; }
  .btn.sm { padding: 3px 8px; min-height: 26px; font-size: .8rem; }

  .notice { padding-block: 8px; padding-inline: 16px; font-size: .85rem; background: var(--warn-soft); color: var(--fg); border-bottom: 1px solid var(--line); }
  .notice[hidden] { display: none; }

  /* Board */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .lane {
    flex: 1; display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden;
    padding-block: 14px; padding-inline: 16px;
  }
  .col {
    flex: 0 0 290px; min-width: 0; display: flex; flex-direction: column;
    background: var(--surface-2); border-radius: 10px; max-height: 100%;
  }
  .col.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .col-head h2 { font-family: var(--display); font-size: .82rem; font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: .06em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-family: var(--mono); font-size: .72rem; color: var(--fg-2); background: var(--surface); padding: 1px 7px; border-radius: 10px; }
  .cards { flex: 1; overflow-y: auto; padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
  .add-inline { margin: 0 8px 10px; }

  .card {
    background: var(--surface); border-radius: 8px; box-shadow: var(--shadow);
    padding: 10px 10px 8px; cursor: grab; border-left: 3px solid transparent;
    display: flex; flex-direction: column; gap: 6px;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .card.p-high { border-left-color: var(--hot); }
  .card.p-med { border-left-color: var(--warn); }
  .card.p-low { border-left-color: var(--line); }
  .card.overdue .due { color: var(--hot); font-weight: 500; }
  .card .title { font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .76rem; color: var(--fg-2); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 10px; background: var(--surface-2); font-size: .74rem; max-width: 100%; }
  .chip.person { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .chip.client { background: var(--surface-2); }
  .due { font-family: var(--mono); font-size: .74rem; }
  .card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
  .mover { display: inline-flex; gap: 2px; }
  .mover button { background: transparent; border: 1px solid var(--line); border-radius: 4px; width: 24px; height: 22px; font-size: .75rem; color: var(--fg-2); padding: 0; }
  .mover button:hover:not(:disabled) { background: var(--surface-2); color: var(--fg); }
  .mover button:disabled { opacity: .35; cursor: default; }

  /* List and people views */
  .list-wrap { flex: 1; overflow: auto; padding-block: 14px; padding-inline: 16px; }
  .group { margin-bottom: 18px; }
  .group h2 { font-family: var(--display); font-size: .85rem; font-weight: 600; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-2); font-weight: 600; background: var(--surface-2); }
  tr:last-child td { border-bottom: 0; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--accent-soft); }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-wrap { overflow-x: auto; }

  /* Empty state */
  .empty {
    margin: 40px auto; max-width: 420px; text-align: center; color: var(--fg-2);
    padding: 24px; border: 1px dashed var(--line); border-radius: 10px;
  }
  .empty h2 { font-family: var(--display); color: var(--fg); font-size: 1rem; margin: 0 0 6px; }
  .empty p { margin: 0 0 12px; }

  /* Side panel editor */
  .scrim { position: fixed; inset: 0; background: rgba(10,16,22,.45); z-index: 30; }
  .scrim[hidden] { display: none; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); z-index: 31;
    background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel[hidden] { display: none; }
  .panel header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .panel header h2 { font-family: var(--display); font-size: 1rem; margin: 0; flex: 1; }
  .panel .body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .panel .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .panel label { display: flex; flex-direction: column; gap: 4px; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-2); }
  .panel label > * { font-size: .92rem; text-transform: none; letter-spacing: 0; color: var(--fg); }
  .panel input[type="text"], .panel select, .panel textarea, .panel input[type="date"] { width: 100%; }
  .panel textarea { min-height: 110px; resize: vertical; }
  .panel footer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .panel footer .spacer { flex: 1; }
  .hint { font-size: .78rem; color: var(--fg-2); }
  .err { font-size: .82rem; color: var(--hot); }
  .err[hidden] { display: none; }

  /* Column settings */
  .col-list { display: flex; flex-direction: column; gap: 6px; }
  .col-row { display: flex; gap: 6px; align-items: center; }
  .col-row input { flex: 1; min-width: 0; }
  .col-row .mover button { width: 28px; height: 30px; }
  .toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: .85rem; z-index: 40; box-shadow: var(--shadow); }
  .toast[hidden] { display: none; }

  @media (max-width: 640px) {
    input[type="search"] { width: 130px; }
    .lane { flex-direction: column; overflow-y: auto; overflow-x: hidden; }
    .col { flex: 0 0 auto; max-height: none; }
    .cards { overflow: visible; }
    .panel .row2 { grid-template-columns: 1fr; }
  }
</style>

<div class="top">
  <div class="brand">
    <h1 id="boardName" title="Click to rename">Earth Group Task Board</h1>
    <span class="sync" id="sync">connecting</span>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search tasks" aria-label="Search tasks">
    <div class="field"><label for="fPerson">Who</label><select id="fPerson"><option value="">Everyone</option></select></div>
    <div class="field"><label for="fClient">Client</label><select id="fClient"><option value="">All</option></select></div>
    <div class="seg" role="group" aria-label="View">
      <button id="vBoard" aria-pressed="true">Board</button>
      <button id="vPeople" aria-pressed="false">By person</button>
      <button id="vList" aria-pressed="false">List</button>
    </div>
    <button class="btn" id="btnCols">Columns</button>
    <button class="btn primary" id="btnAdd">+ Task</button>
  </div>
</div>
<div class="notice" id="notice" hidden></div>

<main>
  <div class="lane" id="lane"></div>
  <div class="list-wrap" id="listWrap" hidden></div>
</main>

<div class="scrim" id="scrim" hidden></div>

<aside class="panel" id="panel" hidden aria-label="Task editor">
  <header><h2 id="panelTitle">New task</h2><button class="btn sm" id="btnClose">Close</button></header>
  <div class="body">
    <label>Title<input type="text" id="tTitle" placeholder="What needs doing"></label>
    <div class="row2">
      <label>Column<select id="tCol"></select></label>
      <label>Priority<select id="tPri"><option value="med">Normal</option><option value="high">High</option><option value="low">Low</option></select></label>
    </div>
    <div class="row2">
      <label>Assigned to<input type="text" id="tWho" list="peopleList" placeholder="Name"></label>
      <label>Client / project<input type="text" id="tClient" list="clientList" placeholder="Optional"></label>
    </div>
    <datalist id="peopleList"></datalist>
    <datalist id="clientList"></datalist>
    <label>Due<input type="date" id="tDue"></label>
    <label>Notes<textarea id="tNotes" placeholder="Details, links, next step"></textarea></label>
    <div class="hint" id="tMeta"></div>
    <div class="err" id="tErr" hidden></div>
  </div>
  <footer>
    <button class="btn danger" id="btnDelete" hidden>Delete</button>
    <span class="spacer"></span>
    <button class="btn" id="btnCancel">Cancel</button>
    <button class="btn primary" id="btnSave">Save</button>
  </footer>
</aside>

<aside class="panel" id="colPanel" hidden aria-label="Column settings">
  <header><h2>Columns</h2><button class="btn sm" id="btnColClose">Close</button></header>
  <div class="body">
    <p class="hint">Rename, reorder, add or remove columns. Tasks in a removed column move to the first column.</p>
    <div class="col-list" id="colList"></div>
    <button class="btn" id="btnColAdd">+ Add column</button>
    <div class="err" id="colErr" hidden></div>
  </div>
  <footer>
    <span class="spacer"></span>
    <button class="btn" id="btnColCancel">Cancel</button>
    <button class="btn primary" id="btnColSave">Save columns</button>
  </footer>
</aside>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DEFAULT_COLS = [
    { id: 'backlog', name: 'Backlog' },
    { id: 'todo', name: 'To do' },
    { id: 'doing', name: 'In progress' },
    { id: 'waiting', name: 'Waiting on' },
    { id: 'done', name: 'Done' },
  ];

  const state = {
    db: null, user: null, canWrite: null,
    config: { name: 'Earth Group Task Board', columns: DEFAULT_COLS },
    configExists: false,
    tasks: [],
    view: 'board', q: '', fPerson: '', fClient: '',
    editing: null, dragId: null, pendingDelete: false,
  };

  // Per-viewer conveniences only.
  try {
    state.view = localStorage.getItem('tb.view') || 'board';
    state.fPerson = localStorage.getItem('tb.person') || '';
    state.fClient = localStorage.getItem('tb.client') || '';
  } catch (e) {}

  const esc = (s) => String(s ?? '');
  const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const fmtDue = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${m}/${d}/${y.slice(2)}`; };
  const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  let toastTimer;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }

  function setSync(mode, label) { const s = $('sync'); s.className = 'sync ' + mode; s.textContent = label; }

  // ---------- Derived data ----------
  function people() { const s = new Set(); state.tasks.forEach(t => t.assignee && s.add(t.assignee)); return [...s].sort((a, b) => a.localeCompare(b)); }
  function clients() { const s = new Set(); state.tasks.forEach(t => t.client && s.add(t.client)); return [...s].sort((a, b) => a.localeCompare(b)); }
  function visible() {
    const q = state.q.trim().toLowerCase();
    return state.tasks.filter(t =>
      (!state.fPerson || t.assignee === state.fPerson) &&
      (!state.fClient || t.client === state.fClient) &&
      (!q || (t.title + ' ' + (t.notes || '') + ' ' + (t.client || '') + ' ' + (t.assignee || '')).toLowerCase().includes(q))
    );
  }
  function colById(id) { return state.config.columns.find(c => c.id === id); }
  const PRI_RANK = { high: 0, med: 1, low: 2 };
  function sortCards(a, b) { return (a.order ?? 0) - (b.order ?? 0) || (a.createdAt || '').localeCompare(b.createdAt || ''); }

  // ---------- Render ----------
  function fillSelect(sel, items, keepValue, firstLabel) {
    const cur = keepValue;
    sel.innerHTML = '';
    const o = document.createElement('option'); o.value = ''; o.textContent = firstLabel; sel.appendChild(o);
    items.forEach(v => { const op = document.createElement('option'); op.value = v; op.textContent = v; sel.appendChild(op); });
    sel.value = items.includes(cur) ? cur : '';
  }
  function fillDatalist(dl, items) { dl.innerHTML = ''; items.forEach(v => { const o = document.createElement('option'); o.value = v; dl.appendChild(o); }); }

  function render() {
    $('boardName').textContent = state.config.name || 'Task Board';
    document.title = state.config.name || 'Task Board';
    fillSelect($('fPerson'), people(), state.fPerson, 'Everyone');
    fillSelect($('fClient'), clients(), state.fClient, 'All');
    fillDatalist($('peopleList'), people());
    fillDatalist($('clientList'), clients());
    ['vBoard', 'vPeople', 'vList'].forEach(id => $(id).setAttribute('aria-pressed', String(id === 'v' + state.view[0].toUpperCase() + state.view.slice(1))));

    const lane = $('lane'), listWrap = $('listWrap');
    if (state.view === 'board') { lane.hidden = false; listWrap.hidden = true; renderBoard(); }
    else { lane.hidden = true; listWrap.hidden = false; renderList(); }
  }

  function cardEl(t) {
    const el = document.createElement('article');
    const over = t.due && t.column !== lastColId() && t.due < todayISO();
    el.className = 'card p-' + (t.priority || 'med') + (over ? ' overdue' : '');
    el.draggable = !!state.canWrite;
    el.dataset.id = t.id;
    const title = document.createElement('div'); title.className = 'title'; title.textContent = t.title; el.appendChild(title);
    const meta = document.createElement('div'); meta.className = 'meta';
    if (t.assignee) { const c = document.createElement('span'); c.className = 'chip person'; c.textContent = t.assignee; meta.appendChild(c); }
    if (t.client) { const c = document.createElement('span'); c.className = 'chip client'; c.textContent = t.client; meta.appendChild(c); }
    if (t.due) { const d = document.createElement('span'); d.className = 'due'; d.textContent = (over ? 'overdue ' : 'due ') + fmtDue(t.due); meta.appendChild(d); }
    if (meta.children.length) el.appendChild(meta);
    const foot = document.createElement('div'); foot.className = 'foot';
    const pri = document.createElement('span'); pri.className = 'hint'; pri.textContent = t.priority === 'high' ? 'High priority' : t.priority === 'low' ? 'Low priority' : '';
    foot.appendChild(pri);
    if (state.canWrite !== false) {
      const idx = state.config.columns.findIndex(c => c.id === t.column);
      const mv = document.createElement('span'); mv.className = 'mover';
      const l = document.createElement('button'); l.textContent = '◀'; l.title = 'Move left'; l.disabled = idx <= 0; l.setAttribute('aria-label', 'Move to previous column');
      const r = document.createElement('button'); r.textContent = '▶'; r.title = 'Move right'; r.disabled = idx >= state.config.columns.length - 1; r.setAttribute('aria-label', 'Move to next column');
      l.onclick = (e) => { e.stopPropagation(); moveTask(t.id, state.config.columns[idx - 1].id); };
      r.onclick = (e) => { e.stopPropagation(); moveTask(t.id, state.config.columns[idx + 1].id); };
      mv.append(l, r); foot.appendChild(mv);
    }
    el.appendChild(foot);
    el.addEventListener('click', () => openEditor(t.id));
    el.addEventListener('dragstart', (e) => { state.dragId = t.id; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', t.id); } catch (_) {} });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); state.dragId = null; document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over')); });
    return el;
  }
  function lastColId() { const c = state.config.columns; return c.length ? c[c.length - 1].id : ''; }

  function renderBoard() {
    const lane = $('lane'); lane.innerHTML = '';
    const vis = visible();
    if (!state.tasks.length) {
      const e = document.createElement('div'); e.className = 'empty';
      e.innerHTML = '<h2>No tasks yet</h2><p>Add the first task with the <strong>+ Task</strong> button. Everyone with the link sees the same board, and changes show up live.</p>';
      const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = '+ Add a task'; b.onclick = () => openEditor(null); e.appendChild(b);
      lane.appendChild(e); return;
    }
    state.config.columns.forEach(col => {
      const c = document.createElement('section'); c.className = 'col'; c.dataset.col = col.id;
      const head = document.createElement('div'); head.className = 'col-head';
      const h = document.createElement('h2'); h.textContent = col.name;
      const items = vis.filter(t => t.column === col.id).sort(sortCards);
      const n = document.createElement('span'); n.className = 'count'; n.textContent = items.length;
      head.append(h, n); c.appendChild(head);
      const cards = document.createElement('div'); cards.className = 'cards';
      items.forEach(t => cards.appendChild(cardEl(t)));
      c.appendChild(cards);
      if (state.canWrite !== false) {
        const add = document.createElement('button'); add.className = 'btn sm add-inline'; add.textContent = '+ Add here';
        add.onclick = () => openEditor(null, col.id); c.appendChild(add);
      }
      c.addEventListener('dragover', (e) => { if (!state.dragId) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; c.classList.add('over'); });
      c.addEventListener('dragleave', (e) => { if (!c.contains(e.relatedTarget)) c.classList.remove('over'); });
      c.addEventListener('drop', (e) => {
        e.preventDefault(); c.classList.remove('over');
        const id = state.dragId; if (!id) return;
        // Position by pointer: find the card below the drop point.
        const siblings = [...cards.querySelectorAll('.card')].filter(x => x.dataset.id !== id);
        let before = null;
        for (const s of siblings) { const r = s.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { before = s.dataset.id; break; } }
        moveTask(id, col.id, before);
      });
      lane.appendChild(c);
    });
  }

  function renderList() {
    const w = $('listWrap'); w.innerHTML = '';
    const vis = visible();
    if (!vis.length) { const e = document.createElement('div'); e.className = 'empty'; e.innerHTML = '<h2>Nothing matches</h2><p>Clear the search or filters, or add a task.</p>'; w.appendChild(e); return; }
    let groups;
    if (state.view === 'people') {
      const m = new Map();
      vis.forEach(t => { const k = t.assignee || 'Unassigned'; if (!m.has(k)) m.set(k, []); m.get(k).push(t); });
      groups = [...m.entries()].sort((a, b) => (a[0] === 'Unassigned') - (b[0] === 'Unassigned') || a[0].localeCompare(b[0]));
    } else {
      groups = [['All tasks', vis.slice()]];
    }
    groups.forEach(([name, items]) => {
      items.sort((a, b) => {
        const ca = state.config.columns.findIndex(c => c.id === a.column), cb = state.config.columns.findIndex(c => c.id === b.column);
        return ca - cb || PRI_RANK[a.priority || 'med'] - PRI_RANK[b.priority || 'med'] || (a.due || '9').localeCompare(b.due || '9');
      });
      const g = document.createElement('div'); g.className = 'group';
      const h = document.createElement('h2'); h.textContent = name; const n = document.createElement('span'); n.className = 'count'; n.textContent = items.length; h.appendChild(n); g.appendChild(h);
      const tw = document.createElement('div'); tw.className = 'table-wrap';
      const tbl = document.createElement('table');
      tbl.innerHTML = '<thead><tr><th>Task</th><th>Status</th><th>Who</th><th>Client</th><th>Priority</th><th>Due</th></tr></thead>';
      const tb = document.createElement('tbody');
      items.forEach(t => {
        const tr = document.createElement('tr'); tr.className = 'row';
        const cells = [t.title, colById(t.column)?.name || '', t.assignee || '', t.client || '', t.priority === 'high' ? 'High' : t.priority === 'low' ? 'Low' : 'Normal', fmtDue(t.due)];
        cells.forEach((v, i) => { const td = document.createElement('td'); if (i === 5) td.className = 'num'; td.textContent = v; tr.appendChild(td); });
        tr.onclick = () => openEditor(t.id);
        tb.appendChild(tr);
      });
      tbl.appendChild(tb); tw.appendChild(tbl); g.appendChild(tw); w.appendChild(g);
    });
  }

  // ---------- Writes ----------
  async function guardWrite() {
    if (!state.db) { toast('Not connected. Changes cannot be saved.'); return false; }
    if (state.canWrite === false) { toast('You have view-only access to this board.'); return false; }
    return true;
  }
  function onWriteError(e) {
    const code = e && e.code;
    if (code === 'invalid_argument') { state.canWrite = false; showReadOnly(); toast('This board is view-only for you.'); }
    else if (code === 'quota_exceeded') toast('Board storage is full. Delete old tasks to add more.');
    else toast('Could not save. Try again.');
    render();
  }
  function showReadOnly() { setSync('ro', 'view only'); $('notice').textContent = 'You can see this board but not change it. Ask the owner to share it with you as a Contributor.'; $('notice').hidden = false; $('btnAdd').hidden = true; $('btnCols').hidden = true; }

  async function moveTask(id, colId, beforeId) {
    if (!(await guardWrite())) return;
    const t = state.tasks.find(x => x.id === id); if (!t) return;
    const inCol = state.tasks.filter(x => x.column === colId && x.id !== id).sort(sortCards);
    let order;
    if (!beforeId) order = inCol.length ? (inCol[inCol.length - 1].order ?? 0) + 1000 : 1000;
    else {
      const i = inCol.findIndex(x => x.id === beforeId);
      const next = inCol[i].order ?? 0, prev = i > 0 ? (inCol[i - 1].order ?? 0) : next - 2000;
      order = (prev + next) / 2;
    }
    if (t.column === colId && t.order === order) return;
    // Optimistic local update so the card lands immediately.
    t.column = colId; t.order = order; render();
    try { await state.db.doc('tasks/' + id).update({ column: colId, order, updatedAt: new Date().toISOString() }); }
    catch (e) { onWriteError(e); }
  }

  // ---------- Editor ----------
  function openEditor(id, colId) {
    if (id === null && state.canWrite === false) { toast('You have view-only access to this board.'); return; }
    state.editing = id; state.pendingDelete = false;
    const t = id ? state.tasks.find(x => x.id === id) : null;
    $('panelTitle').textContent = t ? 'Edit task' : 'New task';
    const sel = $('tCol'); sel.innerHTML = '';
    state.config.columns.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; sel.appendChild(o); });
    sel.value = t ? t.column : (colId || state.config.columns[0]?.id || '');
    $('tTitle').value = t ? t.title : '';
    $('tPri').value = t ? (t.priority || 'med') : 'med';
    $('tWho').value = t ? (t.assignee || '') : (state.fPerson || '');
    $('tClient').value = t ? (t.client || '') : (state.fClient || '');
    $('tDue').value = t ? (t.due || '') : '';
    $('tNotes').value = t ? (t.notes || '') : '';
    $('tMeta').textContent = t ? ('Added ' + (t.createdAt ? new Date(t.createdAt).toLocaleDateString() : '') + (t.updatedAt ? ', updated ' + new Date(t.updatedAt).toLocaleString() : '')) : '';
    $('tErr').hidden = true;
    const ro = state.canWrite === false;
    ['tTitle', 'tCol', 'tPri', 'tWho', 'tClient', 'tDue', 'tNotes'].forEach(k => $(k).disabled = ro);
    $('btnSave').hidden = ro;
    $('btnDelete').hidden = !t || ro; $('btnDelete').textContent = 'Delete';
    $('scrim').hidden = false; $('panel').hidden = false;
    setTimeout(() => $('tTitle').focus(), 30);
  }
  function closeEditor() { $('scrim').hidden = true; $('panel').hidden = true; state.editing = null; }

  async function saveTask() {
    if (!(await guardWrite())) return;
    const title = $('tTitle').value.trim();
    if (!title) { $('tErr').textContent = 'Give the task a title.'; $('tErr').hidden = false; $('tTitle').focus(); return; }
    const now = new Date().toISOString();
    const column = $('tCol').value;
    const body = {
      title, column, priority: $('tPri').value,
      assignee: $('tWho').value.trim(), client: $('tClient').value.trim(),
      due: $('tDue').value || '', notes: $('tNotes').value, updatedAt: now,
    };
    $('btnSave').disabled = true;
    try {
      if (state.editing) {
        const t = state.tasks.find(x => x.id === state.editing);
        if (t && t.column !== column) { const inCol = state.tasks.filter(x => x.column === column); body.order = inCol.length ? Math.max(...inCol.map(x => x.order ?? 0)) + 1000 : 1000; }
        await state.db.doc('tasks/' + state.editing).update(body);
        toast('Saved');
      } else {
        const inCol = state.tasks.filter(x => x.column === column);
        body.order = inCol.length ? Math.max(...inCol.map(x => x.order ?? 0)) + 1000 : 1000;
        body.createdAt = now;
        const id = uid();
        await state.db.doc('tasks/' + id).set(body);
        toast('Task added');
      }
      closeEditor();
    } catch (e) { onWriteError(e); }
    finally { $('btnSave').disabled = false; }
  }
  async function deleteTask() {
    if (!state.editing) return;
    if (!state.pendingDelete) { state.pendingDelete = true; $('btnDelete').textContent = 'Really delete?'; return; }
    if (!(await guardWrite())) return;
    try { await state.db.doc('tasks/' + state.editing).delete(); toast('Deleted'); closeEditor(); }
    catch (e) { onWriteError(e); }
  }

  // ---------- Column settings ----------
  let colDraft = [];
  function openCols() {
    if (state.canWrite === false) { toast('You have view-only access to this board.'); return; }
    colDraft = state.config.columns.map(c => ({ ...c }));
    renderColDraft(); $('colErr').hidden = true;
    $('scrim').hidden = false; $('colPanel').hidden = false;
  }
  function closeCols() { $('scrim').hidden = true; $('colPanel').hidden = true; }
  function renderColDraft() {
    const list = $('colList'); list.innerHTML = '';
    colDraft.forEach((c, i) => {
      const row = document.createElement('div'); row.className = 'col-row';
      const inp = document.createElement('input'); inp.type = 'text'; inp.value = c.name; inp.id = 'colname-' + c.id; inp.setAttribute('aria-label', 'Column name');
      inp.oninput = () => { c.name = inp.value; };
      const mv = document.createElement('span'); mv.className = 'mover';
      const up = document.createElement('button'); up.textContent = '▲'; up.disabled = i === 0; up.setAttribute('aria-label', 'Move up'); up.onclick = () => { [colDraft[i - 1], colDraft[i]] = [colDraft[i], colDraft[i - 1]]; renderColDraft(); };
      const dn = document.createElement('button'); dn.textContent = '▼'; dn.disabled = i === colDraft.length - 1; dn.setAttribute('aria-label', 'Move down'); dn.onclick = () => { [colDraft[i + 1], colDraft[i]] = [colDraft[i], colDraft[i + 1]]; renderColDraft(); };
      const rm = document.createElement('button'); rm.textContent = '✕'; rm.disabled = colDraft.length <= 1; rm.setAttribute('aria-label', 'Remove column'); rm.onclick = () => { colDraft.splice(i, 1); renderColDraft(); };
      mv.append(up, dn, rm);
      row.append(inp, mv); list.appendChild(row);
    });
  }
  async function saveCols() {
    if (!(await guardWrite())) return;
    const cols = colDraft.map(c => ({ id: c.id, name: c.name.trim() })).filter(c => c.name);
    if (!cols.length) { $('colErr').textContent = 'Keep at least one column.'; $('colErr').hidden = false; return; }
    $('btnColSave').disabled = true;
    try {
      await state.db.doc('board/config').set({ ...state.config, columns: cols });
      // Re-home tasks whose column vanished.
      const ids = new Set(cols.map(c => c.id));
      for (const t of state.tasks) { if (!ids.has(t.column)) await state.db.doc('tasks/' + t.id).update({ column: cols[0].id }); }
      toast('Columns saved'); closeCols();
    } catch (e) { onWriteError(e); }
    finally { $('btnColSave').disabled = false; }
  }
  $('btnColAdd').onclick = () => { colDraft.push({ id: 'c' + Date.now().toString(36), name: 'New column' }); renderColDraft(); setTimeout(() => { const last = $('colList').querySelector('.col-row:last-child input'); if (last) { last.focus(); last.select(); } }, 20); };

  // ---------- Board rename ----------
  const nameEl = $('boardName');
  nameEl.addEventListener('click', () => { if (state.canWrite === false || !state.db) return; nameEl.contentEditable = 'true'; nameEl.focus(); });
  nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); } if (e.key === 'Escape') { nameEl.textContent = state.config.name; nameEl.blur(); } });
  nameEl.addEventListener('blur', async () => {
    if (nameEl.contentEditable !== 'true') return;
    nameEl.contentEditable = 'false';
    const v = nameEl.textContent.trim();
    if (!v || v === state.config.name) { nameEl.textContent = state.config.name; return; }
    if (!(await guardWrite())) { nameEl.textContent = state.config.name; return; }
    try { await state.db.doc('board/config').set({ ...state.config, name: v }); toast('Renamed'); } catch (e) { onWriteError(e); }
  });

  // ---------- Wiring ----------
  $('q').addEventListener('input', () => { state.q = $('q').value; render(); });
  $('fPerson').addEventListener('change', () => { state.fPerson = $('fPerson').value; try { localStorage.setItem('tb.person', state.fPerson); } catch (e) {} render(); });
  $('fClient').addEventListener('change', () => { state.fClient = $('fClient').value; try { localStorage.setItem('tb.client', state.fClient); } catch (e) {} render(); });
  const setView = (v) => { state.view = v; try { localStorage.setItem('tb.view', v); } catch (e) {} render(); };
  $('vBoard').onclick = () => setView('board'); $('vPeople').onclick = () => setView('people'); $('vList').onclick = () => setView('list');
  $('btnAdd').onclick = () => openEditor(null);
  $('btnClose').onclick = closeEditor; $('btnCancel').onclick = closeEditor;
  $('btnSave').onclick = saveTask; $('btnDelete').onclick = deleteTask;
  $('btnCols').onclick = openCols; $('btnColClose').onclick = closeCols; $('btnColCancel').onclick = closeCols; $('btnColSave').onclick = saveCols;
  $('scrim').onclick = () => { closeEditor(); closeCols(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeEditor(); closeCols(); } });
  $('tTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveTask(); } });

  // ---------- Boot ----------
  render();
  (async () => {
    const db = await window.claude?.use?.('db');
    if (!db) { setSync('ro', 'offline'); $('notice').textContent = 'Not connected to the shared board. Sign in to claude.ai and reload to see live tasks.'; $('notice').hidden = false; $('btnAdd').hidden = true; $('btnCols').hidden = true; return; }
    state.db = db;
    const user = await window.claude.use('user');
    state.user = user;
    if (user) { const w = await user.can('data.write'); state.canWrite = w; if (w === false) showReadOnly(); }
    setSync('live', 'live');

    db.doc('board/config').onSnapshot((snap) => {
      if (snap.exists) { const d = snap.data(); state.configExists = true; state.config = { name: d.name || state.config.name, columns: Array.isArray(d.columns) && d.columns.length ? d.columns : DEFAULT_COLS }; }
      render();
    }, (e) => { setSync('ro', 'disconnected'); });

    db.collection('tasks').onSnapshot((snap) => {
      state.tasks = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
      setSync(snap.metadata.fromCache ? '' : 'live', snap.metadata.fromCache ? 'syncing' : 'live');
      render();
    }, (e) => { setSync('ro', 'disconnected'); toast('Lost connection to the board. Reload to reconnect.'); });
  })();
})();
</script>
